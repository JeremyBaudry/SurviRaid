services:
  - type: web
    name: surviraid
    runtime: node
    plan: free
    buildCommand: >
      cd frontend && npm install &&
      VITE_API_URL=/api npm run build &&
      mkdir -p ../backend/public && cp -r dist/* ../backend/public/ &&
      cd ../backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/surviraid.db
    # Disque persistant (souvent payant sur Render). Sans disque, la DB SQLite
    # est effacée à chaque redéploiement / redémarrage du free tier.
    disk:
      name: surviraid-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
