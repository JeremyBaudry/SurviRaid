services:
  - type: web
    name: surviraid
    runtime: node
    plan: free
    buildCommand: chmod +x ./render-build.sh && ./render-build.sh
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./surviraid.db
